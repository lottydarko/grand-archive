<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Grand Archive</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#050507" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="A first-person 3D horror exploration and endless seeded survival game set inside a shifting moonlit library."
    />
    <meta property="og:title" content="The Grand Archive" />
    <meta
      property="og:description"
      content="A first-person 3D horror exploration and endless seeded survival game set inside a shifting moonlit library."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Caprasimo&family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Nothing+You+Could+Do&family=Noto+Sans+JP:wght@900&family=Reenie+Beanie&family=Rock+Salt&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-state="startup" class="bg-[#040406] text-[#e5dfd3] overflow-hidden select-none">
    <div id="viewport" data-testid="game-viewport" class="fixed inset-0 w-screen h-screen overflow-hidden"></div>
    <div id="hud-root" class="fixed inset-0 pointer-events-none z-10"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // Offline PWA: register the service worker (shell + runtime asset
      // cache). Harmless where unsupported.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
